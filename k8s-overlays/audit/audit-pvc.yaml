apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-audit
  namespace: workspaces-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Longhorn is the recommended on-prem CSI default. Omit to use the cluster default StorageClass.
  storageClassName: longhorn

