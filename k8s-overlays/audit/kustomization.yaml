apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
  - audit-pvc.yaml
  - auditship-configmap.yaml
  - auditship-cronjob.yaml
patches:
  - path: broker-audit-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: capability-broker
      namespace: workspaces-system

