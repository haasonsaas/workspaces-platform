apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

  # Quotas + CEL-based admission guardrails (see `k8s/optional/hardened/`).
  - ../../k8s/optional/hardened

patches:
  # Namespace-level Pod Security Standards labels (optional hardening).
  - path: podsecurity-agents.yaml
    target:
      kind: Namespace
      name: agents
  - path: podsecurity-desktops.yaml
    target:
      kind: Namespace
      name: desktops
  - path: podsecurity-workspaces-system.yaml
    target:
      kind: Namespace
      name: workspaces-system
