name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt required:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Kustomize Build
        run: |
          kubectl kustomize k8s >/dev/null
          kubectl kustomize k8s-overlays/audit >/dev/null
          kubectl kustomize k8s-overlays/hardened >/dev/null
          kubectl kustomize k8s-overlays/proxies >/dev/null
          kubectl kustomize k8s-overlays/complete >/dev/null
