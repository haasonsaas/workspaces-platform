name: Images

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspaces-operator
            dockerfile: images/workspaces-operator/Dockerfile
          - name: workspaces-capability-broker
            dockerfile: images/capability-broker/Dockerfile
          - name: workspaces-egress-proxy
            dockerfile: images/egress-proxy/Dockerfile
          - name: workspaces-github-webhook
            dockerfile: images/github-webhook/Dockerfile
          - name: workspaces-agent-runner
            dockerfile: images/agent-runner/Dockerfile
          - name: workspaces-desktop
            dockerfile: images/desktop/Dockerfile
          - name: workspaces-auditship
            dockerfile: images/auditship/Dockerfile
          - name: workspaces-ws-proxy
            dockerfile: images/ws-proxy/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

