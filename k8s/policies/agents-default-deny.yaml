apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agents-default-deny
  namespace: agents
spec:
  endpointSelector:
    matchLabels:
      workspaces.platform.dev/app: agent
  egressDeny:
    # Always deny common cloud metadata endpoints (even on-prem). If this ever
    # becomes relevant, you want it to fail closed.
    - toCIDRSet:
        - cidr: 169.254.169.254/32
        - cidr: 169.254.170.2/32
        - cidr: fd00:ec2::254/128
  egress:
    # Allow DNS to kube-dns (adjust labels for your cluster if needed).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              # Default: only allow resolving in-cluster names (prevents DNS exfil
              # when agents are otherwise "corp network off").
              #
              # NOTE: adjust `cluster.local` if your cluster domain differs, or if
              # you use NodeLocalDNS with different endpoint labels.
              - matchPattern: "*.cluster.local"
              - matchPattern: "*.svc.cluster.local"
              - matchPattern: "*.pod.cluster.local"
              # Allow reverse lookups (typically handled by CoreDNS).
              - matchPattern: "*.in-addr.arpa"
              - matchPattern: "*.ip6.arpa"
    # Allow talking to the capability broker (so agents can request scoped unlocks).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: workspaces-system
            app: capability-broker
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # MVP: do NOT allow broad public internet by default. Prefer internal
    # package proxies/mirrors; everything else is unlocked per-job via
    # NetworkGrant (proxy-first via PROXY_CONNECT; STRICT_FQDN is an admin escape hatch).
  ingress: []
