apiVersion: v1
kind: Secret
metadata:
  name: auditship-s3
  namespace: workspaces-system
type: Opaque
stringData:
  # Used by the auditship CronJob (k8s-overlays/audit) to upload audit bundles to MinIO/S3.
  AUDIT_S3_ACCESS_KEY_ID: "<minio_access_key>"
  AUDIT_S3_SECRET_ACCESS_KEY: "<minio_secret_access_key>"
