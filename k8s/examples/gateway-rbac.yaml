apiVersion: v1
kind: ServiceAccount
metadata:
  name: ws-gateway
  namespace: workspaces-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ws-gateway-proxy
rules:
  # ws-proxy needs to resolve Services and pick a backing Pod.
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  # ws-proxy uses the Kubernetes API port-forward subresource.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  # For autosuspend, ws-proxy updates Desktop.last-active annotation.
  - apiGroups: ["workspaces.platform.dev"]
    resources: ["desktops"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ws-gateway-proxy
  namespace: desktops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ws-gateway-proxy
subjects:
  - kind: ServiceAccount
    name: ws-gateway
    namespace: workspaces-system

