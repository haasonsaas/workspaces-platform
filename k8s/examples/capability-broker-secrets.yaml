apiVersion: v1
kind: Secret
metadata:
  name: capability-broker-secrets
  namespace: workspaces-system
type: Opaque
stringData:
  # Required: HS256 signing key for per-job broker tokens. Generate with:
  #   openssl rand -hex 32
  job_jwt_secret: "<random_hex_or_base64_secret>"

  # Optional: admin token for approval endpoints and wsctl.
  admin_token: "<random_admin_token>"

  # Optional: webhook token used by github-webhook and GitHub-triggered job creation.
  webhook_token: "<random_webhook_token>"

