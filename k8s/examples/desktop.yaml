apiVersion: workspaces.platform.dev/v1alpha1
kind: Desktop
metadata:
  name: jonathan
  namespace: desktops
spec:
  user: jonathan
  # Optional: reverse-tunnel connectivity (requires ws-relayd on the gateway and
  # operator relay config; see docs/connectivity.md).
  # connectivity:
  #   mode: relay
  ssh:
    authorizedKeys:
      # TODO: replace with your public key(s)
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@laptop"
  home:
    size: 50Gi
    # Optional: seed the home PVC from a HomeTemplate snapshot for warm starts.
    # seed:
    #   templateRef: default-home
    # Optional: reset home by switching to a new PVC restored from snapshot.
    # Bump requestedAt to trigger a reset.
    # reset:
    #   requestedAt: "2026-02-09T00:00:00Z"
    #   templateRef: default-home
    #   retainOldClaims: 1
  # Optional: autosuspend after inactivity (updated by ws-proxy on connect).
  idleTimeoutSeconds: 3600
  suspended: false
  nodeSelector:
    workspaces.platform.dev/pool: desktops
  tolerations:
    - key: workspaces.platform.dev/pool
      operator: Equal
      value: desktops
      effect: NoSchedule
