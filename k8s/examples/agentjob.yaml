apiVersion: workspaces.platform.dev/v1alpha1
kind: AgentJob
metadata:
  name: example
  namespace: agents
spec:
  image: ghcr.io/haasonsaas/workspaces-agent-runner:latest
  # Recommended: script mode (workspaces agent runner) for capped + redacted logs.
  script: |
    set -euo pipefail
    echo "hello from agent"
    sleep 5
  policyProfile: restricted
  ttlSecondsAfterFinished: 3600
  runtimeClassName: kata
  nodeSelector:
    workspaces.platform.dev/pool: agents
  tolerations:
    - key: workspaces.platform.dev/pool
      operator: Equal
      value: agents
      effect: NoSchedule
