apiVersion: workspaces.platform.dev/v1alpha1
kind: NetworkGrant
metadata:
  name: example-github
  namespace: agents
spec:
  policyMode: STRICT_FQDN
  protocol: TCP
  approved: true
  approvedBy: admin
  reason: "allow GitHub for this job"
  purpose: "allow GitHub API access for fetching PR metadata"
  ttlSeconds: 1800
  agentJobRef:
    name: example
  egress:
    - host: github.com
      ports: [443]
    - host: api.github.com
      ports: [443]
  # Optional: allow DNS resolution for additional names without granting egress.
  # Useful if a granted hostname resolves via CNAME and your baseline DNS policy
  # is strict.
  # dnsAllow:
  #   - github.map.fastly.net
