apiVersion: v1
kind: Secret
metadata:
  name: workspaces-operator-secrets
  namespace: workspaces-system
type: Opaque
stringData:
  # Shared HS256 signing key used to mint per-desktop relay JWTs when a Desktop
  # uses `spec.connectivity.mode=relay`.
  #
  # This must match `WS_RELAYD_JWT_SECRET` on the gateway host running ws-relayd.
  #
  # Generate a strong value, for example:
  #   openssl rand -hex 32
  desktop_relay_jwt_secret: "CHANGE_ME"
