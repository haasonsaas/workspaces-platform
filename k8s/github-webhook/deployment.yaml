apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-webhook
  namespace: workspaces-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-webhook
  template:
    metadata:
      labels:
        app: github-webhook
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-webhook
          image: ghcr.io/haasonsaas/workspaces-github-webhook:latest
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: HOME
              value: "/tmp"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-webhook-secrets
                  key: webhook_secret
            - name: GITHUB_REPO_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: github-webhook-config
                  key: github_repo_allowlist
            - name: GITHUB_APPROVER_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: github-webhook-config
                  key: github_approver_allowlist
            - name: GITHUB_LAUNCHER_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: github-webhook-config
                  key: github_launcher_allowlist
                  optional: true
            - name: BROKER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: github-webhook-config
                  key: broker_base_url
            - name: BROKER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-webhook-secrets
                  key: broker_webhook_token
                  optional: true
            # Backwards-compatible fallback; prefer BROKER_WEBHOOK_TOKEN.
            - name: BROKER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-webhook-secrets
                  key: broker_admin_token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
      volumes:
        - name: tmp
          emptyDir: {}
