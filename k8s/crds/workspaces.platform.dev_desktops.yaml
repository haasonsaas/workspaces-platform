---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: desktops.workspaces.platform.dev
spec:
  group: workspaces.platform.dev
  names:
    kind: Desktop
    listKind: DesktopList
    plural: desktops
    shortNames:
    - desk
    singular: desktop
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Desktop is the Schema for the desktops API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DesktopSpec defines the desired state of Desktop.
            properties:
              connectivity:
                description: Connectivity controls how the access gateway reaches
                  this Desktop.
                properties:
                  mode:
                    description: |-
                      Mode selects the connectivity mode for this Desktop.
                      portforward (default): use ws-proxy on the gateway (Kubernetes API port-forward).
                      relay: use an in-pod ws-desktop-agent sidecar that maintains an outbound
                      connection to ws-relayd on the gateway (no gateway kubeconfig).
                    enum:
                    - portforward
                    - relay
                    type: string
                type: object
              home:
                properties:
                  reset:
                    description: |-
                      Reset controls home reset behavior. A reset is triggered when requestedAt
                      changes and a valid snapshot source is configured.
                    properties:
                      requestedAt:
                        description: RequestedAt triggers a reset when changed.
                        format: date-time
                        type: string
                      retainOldClaims:
                        description: |-
                          RetainOldClaims controls how many previous home PVC revisions to keep.
                          Defaults to 1.
                        format: int32
                        type: integer
                      snapshotName:
                        description: SnapshotName is a specific VolumeSnapshot name
                          to reset from.
                        type: string
                      templateRef:
                        description: TemplateRef names a HomeTemplate to reset from
                          (preferred).
                        type: string
                    type: object
                  seed:
                    description: Seed controls initial creation of the home PVC when
                      it does not exist.
                    properties:
                      snapshotName:
                        description: SnapshotName is a specific VolumeSnapshot name
                          to seed from.
                        type: string
                      templateRef:
                        description: |-
                          TemplateRef names a HomeTemplate in the same namespace whose latest
                          ready snapshot should be used as the PVC dataSource.
                        type: string
                    type: object
                  size:
                    description: Size is the requested storage size (e.g. "50Gi").
                    type: string
                  storageClassName:
                    description: StorageClassName for the home PVC created for this
                      Desktop.
                    type: string
                type: object
              idleTimeoutSeconds:
                description: |-
                  IdleTimeoutSeconds suspends the desktop after inactivity (based on
                  lastActiveAt updates from the access gateway). 0 disables autosuspend.
                format: int32
                type: integer
              image:
                description: |-
                  Image is the OCI image used for the desktop container.
                  If omitted, the operator default is used.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector and Tolerations let you target a desktop
                  node pool.
                type: object
              resources:
                description: Resources applied to the desktop container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              securityProfile:
                description: SecurityProfile selects a policy bundle (e.g. "standard",
                  "priv-compat").
                type: string
              ssh:
                properties:
                  authorizedKeys:
                    description: AuthorizedKeys are SSH public keys allowed to access
                      this desktop.
                    items:
                      type: string
                    type: array
                type: object
              suspended:
                description: Suspended scales the desktop compute to zero while preserving
                  storage.
                type: boolean
              tolerations:
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              user:
                description: User is the Linux username inside the desktop.
                type: string
            required:
            - user
            type: object
          status:
            description: DesktopStatus defines the observed state of Desktop.
            properties:
              conditions:
                description: Conditions follows Kubernetes conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              homeClaimName:
                description: HomeClaimName is the currently mounted home PVC name.
                type: string
              homeRevision:
                description: HomeRevision increments when home is reset.
                format: int64
                type: integer
              lastActiveAt:
                description: |-
                  LastActiveAt is best-effort and is typically updated by the gateway or
                  ws-proxy on connection.
                format: date-time
                type: string
              lastResetAt:
                description: LastResetAt records the last observed successful reset
                  request timestamp.
                format: date-time
                type: string
              phase:
                type: string
              serviceName:
                description: ServiceName is the in-cluster Service exposing SSH.
                type: string
              suspended:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
