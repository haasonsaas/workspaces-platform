---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: networkgrants.workspaces.platform.dev
spec:
  group: workspaces.platform.dev
  names:
    kind: NetworkGrant
    listKind: NetworkGrantList
    plural: networkgrants
    shortNames:
    - ngrant
    singular: networkgrant
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentJobRef:
                description: |-
                  AgentJobRef selects the AgentJob this grant applies to.
                  When set, the controller derives a stable pod selector based on the
                  AgentJob name (labels: workspaces.platform.dev/app=agent and
                  workspaces.platform.dev/agentjob=<name>).
                properties:
                  name:
                    description: |-
                      Name is the AgentJob name this grant applies to.
                      The grant must be created in the same namespace as the AgentJob.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              allowNon443:
                description: AllowNon443 allows non-443 ports in egress rules. Defaults
                  to false.
                type: boolean
              approved:
                description: Approved gates whether the grant should be enforced.
                type: boolean
              approvedBy:
                type: string
              dnsAllow:
                description: |-
                  DNSAllow adds additional DNS names the pod may resolve (DNS queries),
                  without granting direct egress to those names. This is useful to allow
                  CNAME chains while keeping egress constrained by `spec.egress`.

                  MVP: exact match only (no wildcards).
                items:
                  type: string
                type: array
              egress:
                description: Egress destinations to allow.
                items:
                  properties:
                    host:
                      description: |-
                        Host is a DNS name allowed for egress (Cilium FQDN policy).
                        MVP: exact match only (no wildcards).
                      type: string
                    ports:
                      description: Ports are allowed TCP ports. If empty, defaults
                        to [443].
                      items:
                        format: int32
                        type: integer
                      type: array
                  required:
                  - host
                  type: object
                minItems: 1
                type: array
              podSelector:
                description: |-
                  PodSelector selects the pods this grant applies to.
                  Deprecated: prefer AgentJobRef for stable least-privilege binding.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              policyMode:
                description: |-
                  PolicyMode selects how egress rules are interpreted.
                  Modes:
                  - STRICT_FQDN: controller enforces direct egress using Cilium toFQDNs.
                  - PROXY_CONNECT: egress is enforced via an in-cluster HTTP CONNECT proxy.
                enum:
                - STRICT_FQDN
                - PROXY_CONNECT
                type: string
              protocol:
                description: Protocol is currently TCP only.
                enum:
                - TCP
                type: string
              purpose:
                description: Purpose is a human-readable justification for the access
                  request.
                minLength: 1
                type: string
              reason:
                type: string
              ttlSeconds:
                description: TTLSeconds is how long this grant remains active after
                  approval.
                format: int32
                type: integer
            required:
            - egress
            - purpose
            type: object
          status:
            properties:
              active:
                type: boolean
              approvedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiresAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
