apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  namespace: workspaces-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-proxy
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["workspaces.platform.dev"]
    resources: ["networkgrants"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-proxy
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-proxy
subjects:
  - kind: ServiceAccount
    name: egress-proxy
    namespace: workspaces-system

