apiVersion: v1
kind: ServiceAccount
metadata:
  name: capability-broker
  namespace: workspaces-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capability-broker
rules:
  - apiGroups: ["workspaces.platform.dev"]
    resources: ["networkgrants"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["workspaces.platform.dev"]
    resources: ["networkgrants/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capability-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capability-broker
subjects:
  - kind: ServiceAccount
    name: capability-broker
    namespace: workspaces-system

