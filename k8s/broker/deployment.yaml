apiVersion: apps/v1
kind: Deployment
metadata:
  name: capability-broker
  namespace: workspaces-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capability-broker
  template:
    metadata:
      labels:
        app: capability-broker
    spec:
      serviceAccountName: capability-broker
      containers:
        - name: broker
          image: ghcr.io/haasonsaas/workspaces-capability-broker:latest
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Required: per-job auth signing secret (HS256). Used for agent-facing endpoints
            # (/v1/network-grants, /v1/github/open-pr).
            - name: BROKER_JOB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: capability-broker-secrets
                  key: job_jwt_secret
                  optional: false
            # Optional: set to require admin auth for approval endpoints.
            - name: BROKER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capability-broker-secrets
                  key: admin_token
                  optional: true
            # Optional: used by GitHub webhook bridge (PR comment approvals / agent run triggers).
            - name: BROKER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capability-broker-secrets
                  key: webhook_token
                  optional: true
            # NetworkGrant policy guardrails (proxy-first by default).
            - name: BROKER_NETWORK_PUBLIC_EGRESS_MODE
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: broker_network_public_egress_mode
                  optional: true
            - name: BROKER_NETWORK_PUBLIC_EGRESS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: broker_network_public_egress_allowlist
                  optional: true
            - name: BROKER_NETWORK_PUBLIC_DNS_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: broker_network_public_dns_allowlist
                  optional: true
            - name: BROKER_NETWORK_INTERNAL_SUFFIX_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: broker_network_internal_suffix_allowlist
                  optional: true
            # GitHub App integration (broker-only writes). Optional, but required to enable /v1/github/open-pr.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: capability-broker-github-app
                  key: app_id
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: capability-broker-github-app
                  key: installation_id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/github-app/private-key.pem
            - name: GITHUB_REPO_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_repo_allowlist
                  optional: true
            - name: GITHUB_DEFAULT_BASE_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_default_base_branch
                  optional: true
            - name: GITHUB_BASE_BRANCH_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_base_branch_allowlist
                  optional: true
            - name: GITHUB_BRANCH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_branch_prefix
                  optional: true
            - name: GITHUB_GIT_AUTHOR_NAME
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_git_author_name
                  optional: true
            - name: GITHUB_GIT_AUTHOR_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_git_author_email
                  optional: true
            - name: GITHUB_MAX_FILES_CHANGED
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_max_files_changed
                  optional: true
            - name: GITHUB_ALLOW_BINARY_PATCHES
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_allow_binary_patches
                  optional: true
            - name: GITHUB_SENSITIVE_PATH_PREFIX_DENYLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_sensitive_path_prefix_denylist
                  optional: true
            - name: GITHUB_SENSITIVE_PATH_ALLOWLIST_REPOS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_sensitive_path_allowlist_repos
                  optional: true
            # Agent job defaults (used by /v1/agent-jobs).
            - name: AGENT_DEFAULT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_default_image
                  optional: true
            - name: AGENT_DEFAULT_POLICY_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_default_policy_profile
                  optional: true
            - name: AGENT_DEFAULT_TTL_SECONDS_AFTER_FINISHED
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_default_ttl_seconds_after_finished
                  optional: true
            - name: AGENT_DEFAULT_RUNTIME_CLASS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_default_runtime_class
                  optional: true
            - name: AGENT_DEFAULT_SCRIPT
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_default_script
                  optional: true
            # Optional: concurrency + autogrant controls for GitHub-triggered jobs.
            - name: AGENT_MAX_CONCURRENT
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_max_concurrent
                  optional: true
            - name: AGENT_MAX_CONCURRENT_PER_REPO
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_max_concurrent_per_repo
                  optional: true
            - name: AGENT_AUTO_GRANT_GITHUB
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_auto_grant_github
                  optional: true
            - name: AGENT_AUTO_GRANT_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_auto_grant_ttl_seconds
                  optional: true
            - name: AGENT_JOB_TOKEN_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: agent_job_token_ttl_seconds
                  optional: true
            # Optional: artifact store (MinIO/S3) for agent logs/results.
            - name: ARTIFACT_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_s3_endpoint
                  optional: true
            - name: ARTIFACT_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_s3_bucket
                  optional: true
            - name: ARTIFACT_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_s3_region
                  optional: true
            - name: ARTIFACT_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_s3_prefix
                  optional: true
            - name: ARTIFACT_S3_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_s3_force_path_style
                  optional: true
            - name: ARTIFACT_PUBLISH_LINKS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_publish_links
                  optional: true
            - name: ARTIFACT_PRESIGN_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: artifact_presign_ttl_seconds
                  optional: true
            - name: ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: capability-broker-artifacts
                  key: access_key_id
                  optional: true
            - name: ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: capability-broker-artifacts
                  key: secret_access_key
                  optional: true
            # Optional: check-runs for agent-job triggers.
            - name: GITHUB_ENABLE_CHECK_RUNS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_enable_check_runs
                  optional: true
            - name: GITHUB_CHECK_RUN_NAME
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_check_run_name
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: github-app
              mountPath: /etc/github-app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
      volumes:
        - name: github-app
          secret:
            secretName: capability-broker-github-app
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: capability-broker
  namespace: workspaces-system
spec:
  selector:
    app: capability-broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
