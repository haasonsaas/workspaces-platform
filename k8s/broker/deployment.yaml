apiVersion: apps/v1
kind: Deployment
metadata:
  name: capability-broker
  namespace: workspaces-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capability-broker
  template:
    metadata:
      labels:
        app: capability-broker
    spec:
      serviceAccountName: capability-broker
      containers:
        - name: broker
          # TODO: publish/build this image.
          image: ghcr.io/workspaces-platform/capability-broker:latest
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            # Required for agent-facing endpoints (/v1/network-grants, /v1/github/open-pr).
            - name: BROKER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capability-broker-secrets
                  key: agent_token
                  optional: true
            # Optional: set to require admin auth for approval endpoints.
            - name: BROKER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capability-broker-secrets
                  key: admin_token
                  optional: true
            # GitHub App integration (broker-only writes). Optional, but required to enable /v1/github/open-pr.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: capability-broker-github-app
                  key: app_id
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: capability-broker-github-app
                  key: installation_id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/github-app/private-key.pem
            - name: GITHUB_REPO_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_repo_allowlist
                  optional: true
            - name: GITHUB_DEFAULT_BASE_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_default_base_branch
                  optional: true
            - name: GITHUB_BASE_BRANCH_ALLOWLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_base_branch_allowlist
                  optional: true
            - name: GITHUB_BRANCH_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_branch_prefix
                  optional: true
            - name: GITHUB_GIT_AUTHOR_NAME
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_git_author_name
                  optional: true
            - name: GITHUB_GIT_AUTHOR_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_git_author_email
                  optional: true
            - name: GITHUB_MAX_FILES_CHANGED
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_max_files_changed
                  optional: true
            - name: GITHUB_ALLOW_BINARY_PATCHES
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_allow_binary_patches
                  optional: true
            - name: GITHUB_SENSITIVE_PATH_PREFIX_DENYLIST
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_sensitive_path_prefix_denylist
                  optional: true
            - name: GITHUB_SENSITIVE_PATH_ALLOWLIST_REPOS
              valueFrom:
                configMapKeyRef:
                  name: capability-broker-config
                  key: github_sensitive_path_allowlist_repos
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: github-app
              mountPath: /etc/github-app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
      volumes:
        - name: github-app
          secret:
            secretName: capability-broker-github-app
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: capability-broker
  namespace: workspaces-system
spec:
  selector:
    app: capability-broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
