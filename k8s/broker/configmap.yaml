apiVersion: v1
kind: ConfigMap
metadata:
  name: capability-broker-config
  namespace: workspaces-system
data:
  # Comma-separated allowlist of owner/repo entries. Empty => GitHub integration disabled (secure default).
  github_repo_allowlist: ""

  # Base branch defaults/constraints.
  github_default_base_branch: "main"
  github_base_branch_allowlist: "main"

  # Branch naming policy for broker-created PR branches.
  github_branch_prefix: "agent/"

  # Commit identity used by the broker.
  github_git_author_name: "workspaces-broker"
  github_git_author_email: "workspaces-broker@localhost"

  # Patch safety limits (defense-in-depth).
  github_max_files_changed: "100"
  github_allow_binary_patches: "false"
  github_sensitive_path_prefix_denylist: ".github/workflows/,infra/,terraform/,deploy/"
  # Comma-separated owner/repo allowlist that may touch sensitive paths.
  github_sensitive_path_allowlist_repos: ""

  # Agent job defaults (used by /v1/agent-jobs).
  agent_default_image: "ghcr.io/workspaces-platform/agent-runner:latest"
  agent_default_policy_profile: "restricted"
  agent_default_ttl_seconds_after_finished: "3600"
  agent_default_runtime_class: "kata"

  # Optional: check-runs for /agent run workflow (requires GitHub App permissions).
  github_enable_check_runs: "false"
  github_check_run_name: "workspaces-agent"
