apiVersion: v1
kind: ConfigMap
metadata:
  name: capability-broker-config
  namespace: workspaces-system
data:
  # NetworkGrant guardrails (proxy-first by default).
  broker_network_public_egress_mode: "deny" # deny|allow
  broker_network_public_egress_allowlist: "" # CSV exact public hostnames
  broker_network_public_dns_allowlist: "" # CSV exact DNS names allowed in dnsAllow
  broker_network_internal_suffix_allowlist: "svc.cluster.local,cluster.local"

  # Comma-separated allowlist of owner/repo entries. Empty => GitHub integration disabled (secure default).
  github_repo_allowlist: ""

  # Base branch defaults/constraints.
  github_default_base_branch: "main"
  github_base_branch_allowlist: "main"

  # Branch naming policy for broker-created PR branches.
  github_branch_prefix: "agent/"

  # Commit identity used by the broker.
  github_git_author_name: "workspaces-broker"
  github_git_author_email: "workspaces-broker@localhost"

  # Patch safety limits (defense-in-depth).
  github_max_files_changed: "100"
  github_allow_binary_patches: "false"
  github_sensitive_path_prefix_denylist: ".github/workflows/,infra/,terraform/,deploy/"
  # Comma-separated owner/repo allowlist that may touch sensitive paths.
  github_sensitive_path_allowlist_repos: ""

  # Agent job defaults (used by /v1/agent-jobs).
  agent_default_image: "ghcr.io/workspaces-platform/agent-runner:latest"
  agent_default_policy_profile: "restricted"
  agent_default_ttl_seconds_after_finished: "3600"
  agent_default_runtime_class: "kata"
  agent_default_script: |
    set -euo pipefail
    cd "${WORKSPACES_REPO_DIR:-/workspace/repo}"
    if [ -x .workspaces/agent.sh ]; then
      exec .workspaces/agent.sh
    fi
    if [ -f .workspaces/agent.sh ]; then
      bash .workspaces/agent.sh
      exit 0
    fi
    echo "No .workspaces/agent.sh found; nothing to do."

  # Concurrency controls for GitHub-triggered jobs (0 = unlimited).
  agent_max_concurrent: "0"
  agent_max_concurrent_per_repo: "0"

  # Keep baseline agent egress strict default-deny; allow only minimal GitHub egress
  # for PR-scoped jobs via a short-lived autogrant.
  agent_auto_grant_github: "true"
  agent_auto_grant_ttl_seconds: "7200"

  # Per-job broker token TTL (job identity for calling agent-facing broker endpoints).
  agent_job_token_ttl_seconds: "7200"

  # Optional: artifact store (MinIO/S3) for job logs/results (used in check-runs).
  # Keep endpoint/bucket empty to disable uploads.
  artifact_s3_endpoint: ""
  artifact_s3_bucket: ""
  artifact_s3_region: "us-east-1"
  artifact_s3_prefix: "workspaces"
  artifact_s3_force_path_style: "true"
  artifact_publish_links: "false"
  artifact_presign_ttl_seconds: "86400"

  # Optional: check-runs for /agent run workflow (requires GitHub App permissions).
  github_enable_check_runs: "false"
  github_check_run_name: "workspaces-agent"
