apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workspaces-desktop-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["workspaces.platform.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["desktops"]
  validations:
    # Strong recommendation for reproducibility + supply chain control.
    # Allow empty (operator default), but when set it must be pinned by digest.
    - expression: "!has(object.spec.image) || object.spec.image == '' || object.spec.image.matches('.*@sha256:[0-9a-fA-F]{64}$')"
      message: "Desktop spec.image must be pinned by digest (image@sha256:...) or omitted to use the operator default"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workspaces-desktop-guardrails
spec:
  policyName: workspaces-desktop-guardrails
  validationActions: [Deny]

