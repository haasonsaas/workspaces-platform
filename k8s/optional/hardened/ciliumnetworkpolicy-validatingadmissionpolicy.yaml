apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workspaces-cilium-policy-operator-only
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agents
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ciliumnetworkpolicies"]
  validations:
    # Prevent bypass: a user who can create CiliumNetworkPolicy in the agents
    # namespace can grant themselves arbitrary egress.
    - expression: "request.userInfo.username == 'system:serviceaccount:workspaces-system:workspaces-operator' || request.userInfo.groups.exists(g, g == 'system:masters')"
      message: "CiliumNetworkPolicy changes in agents are restricted to the operator (or cluster admins)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workspaces-cilium-policy-operator-only
spec:
  policyName: workspaces-cilium-policy-operator-only
  validationActions: [Deny]

