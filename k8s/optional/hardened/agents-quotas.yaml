apiVersion: v1
kind: LimitRange
metadata:
  name: agents-default-limits
  namespace: agents
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      default:
        cpu: "2"
        memory: "4Gi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agents-quota
  namespace: agents
spec:
  hard:
    pods: "50"
    count/jobs.batch: "100"
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"

