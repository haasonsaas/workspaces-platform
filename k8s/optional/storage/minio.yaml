apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: workspaces-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  # Longhorn is the recommended on-prem default; omit to use the cluster default.
  storageClassName: longhorn

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: workspaces-system
  labels:
    workspaces.platform.dev/app: storage
    workspaces.platform.dev/component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        workspaces.platform.dev/app: storage
        workspaces.platform.dev/component: minio
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # Pin by digest in production.
          image: minio/minio:latest
          args:
            - server
            - /data
            - "--console-address=:9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root_user
                  optional: false
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root_password
                  optional: false
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: workspaces-system
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

