apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaces-operator
  namespace: workspaces-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspaces-operator
  template:
    metadata:
      labels:
        app: workspaces-operator
    spec:
      serviceAccountName: workspaces-operator
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/haasonsaas/workspaces-operator:latest
          env:
            - name: HOME
              value: "/tmp"
            - name: AGENT_EGRESS_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: agent_egress_proxy_url
                  optional: true
            - name: AGENT_NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: agent_no_proxy
                  optional: true
            - name: DESKTOP_RELAY_AGENT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: desktop_relay_agent_image
                  optional: true
            - name: DESKTOP_RELAYD_CONTROL_ADDR
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: desktop_relayd_control_addr
                  optional: true
            - name: DESKTOP_RELAYD_DATA_ADDR
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: desktop_relayd_data_addr
                  optional: true
            - name: DESKTOP_RELAY_JWT_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: desktop_relay_jwt_ttl_seconds
                  optional: true
            - name: DESKTOP_RELAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workspaces-operator-secrets
                  key: desktop_relay_jwt_secret
                  optional: true
          args:
            - "--leader-elect=true"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
            - "--networkgrant-max-ttl-seconds=7200"
            - "--networkgrant-max-egress-rules=20"
            - "--networkgrant-max-dns-names=50"
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
