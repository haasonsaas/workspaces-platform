apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaces-operator
  namespace: workspaces-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspaces-operator
  template:
    metadata:
      labels:
        app: workspaces-operator
    spec:
      serviceAccountName: workspaces-operator
      containers:
        - name: operator
          image: ghcr.io/haasonsaas/workspaces-operator:latest
          env:
            - name: AGENT_EGRESS_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: agent_egress_proxy_url
                  optional: true
            - name: AGENT_NO_PROXY
              valueFrom:
                configMapKeyRef:
                  name: workspaces-operator-config
                  key: agent_no_proxy
                  optional: true
          args:
            - "--leader-elect=true"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
            - "--networkgrant-max-ttl-seconds=7200"
            - "--networkgrant-max-egress-rules=20"
            - "--networkgrant-max-dns-names=50"
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
